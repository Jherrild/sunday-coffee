name: Update Coffee Status

on:
  # Allow manual trigger with input parameter
  workflow_dispatch:
    inputs:
      coffee_status:
        description: 'Coffee status (true for ON, false for OFF)'
        required: true
        type: boolean
        default: true

# Permissions needed for creating PRs and pushing
permissions:
  contents: write
  pull-requests: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate next Sunday and update files
        id: update
        env:
          COFFEE_STATUS: ${{ inputs.coffee_status }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { getCoffeeDates } = require('./coffee-dates');
          const coffeeStatus = process.env.COFFEE_STATUS === 'true';
          const { nextSunday, branchDate, lastUpdated } = getCoffeeDates();

          console.log('=== Coffee Status Update Script ===');
          console.log('Input coffee_status:', process.env.COFFEE_STATUS);
          console.log('Next Sunday:', nextSunday);

          let content = fs.readFileSync('index.html', 'utf8');
          const statusClass = coffeeStatus ? 'status-on' : 'status-off';
          // Anchor to the real body tag, not examples inside comments.
          const bodyPattern = /^<body class="status-(on|off)">/m;
          console.log('Current body tag:', content.match(bodyPattern)?.[0] || 'NOT FOUND');
          content = content.replace(bodyPattern, `<body class="${statusClass}">`);
          console.log('Updated body tag:', content.match(bodyPattern)?.[0] || 'NOT FOUND');

          console.log('Current date:', content.match(/<div class="date">.*?<\/div>/)?.[0] || 'NOT FOUND');
          content = content.replace(
            /<div class="date">.*?<\/div>/,
            `<div class="date">${nextSunday}</div>`
          );
          console.log('Updated date to:', nextSunday);

          content = content.replace(
            /<strong>Last updated:<\/strong>\s+[A-Za-z]+\s+\d+,\s+\d+/,
            `<strong>Last updated:</strong> ${lastUpdated}`
          );
          console.log('Updated last modified to:', lastUpdated);
          fs.writeFileSync('index.html', content, 'utf8');
          // One clock sample supplies the HTML, PR title, and branch date.
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `next_sunday=${nextSunday}\nbranch_date=${branchDate}\n`);
          console.log('✅ Updated index.html');
          NODE

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-${{ steps.update.outputs.branch_date }}
          base: main
          title: "Update coffee status for ${{ steps.update.outputs.next_sunday }}"
          body: |
            ## Coffee Status Update
            
            **Status**: ${{ fromJSON(inputs.coffee_status) && '☕ Coffee is ON' || '😢 Coffee is OFF' }}
            **Date**: ${{ steps.update.outputs.next_sunday }}
            
            This PR was automatically generated by the Update Coffee Status workflow.
            
            ### Changes
            - Updated coffee status to `${{ fromJSON(inputs.coffee_status) && 'status-on' || 'status-off' }}`
            - Updated date to ${{ steps.update.outputs.next_sunday }}
            - Updated last modified timestamp
            
            ---
            *This PR will be automatically merged.*
          commit-message: "Update coffee status for ${{ steps.update.outputs.next_sunday }}"
          delete-branch: true

      - name: Merge Pull Request
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          # Wait a moment for PR to be fully created
          sleep 2
          
          # Merge the PR
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
