<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coffee Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="/resources/coffee_icon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --on-bg-gradient-start: #111117;
      --on-bg-gradient-end: #2b1e18;
      --off-bg-gradient-start: var(--on-bg-gradient-start);
      --off-bg-gradient-end: var(--on-bg-gradient-end);

      --on-accent: #ffad66;
      --on-accent-soft: rgba(255, 173, 102, 0.12);
      --off-accent: #efa4bd;
      --off-accent-soft: rgba(239, 164, 189, 0.12);

      --card-bg: #242126;
      --card-border: #5d4034;
      --chip-bg: #302a2c;
      --chip-border: #51413c;
      --text-main: #faf1e6;
      --text-muted: #baacb7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
      transition: background 0.3s ease;
    }

    body.status-on {
      background: linear-gradient(
        135deg,
        var(--on-bg-gradient-start),
        var(--on-bg-gradient-end)
      );
    }

    body.status-off {
      background: linear-gradient(
        135deg,
        var(--off-bg-gradient-start),
        var(--off-bg-gradient-end)
      );
    }

    .halloween-web {
      position: absolute;
      top: 0;
      right: 0;
      width: clamp(82px, 20vw, 208px);
      height: auto;
      color: rgba(249, 229, 209, 0.36);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 2px solid #d57937;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      padding: 24px 22px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -80px;
      right: -80px;
      opacity: 0.9;
      pointer-events: none;
      transition: background 0.3s ease;
    }

    body.status-on .card::before {
      background: radial-gradient(circle at center, var(--on-accent-soft), transparent 60%);
    }

    body.status-off .card::before {
      background: radial-gradient(circle at center, var(--off-accent-soft), transparent 60%);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    body.status-on .tag {
      background: var(--on-accent-soft);
      color: var(--on-accent);
    }

    body.status-off .tag {
      background: var(--off-accent-soft);
      color: var(--off-accent);
    }

    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.1);
    }

    body.status-on .tag-dot {
      background: var(--on-accent);
      box-shadow: 0 0 0 5px var(--on-accent-soft);
    }

    body.status-off .tag-dot {
      background: var(--off-accent);
      box-shadow: 0 0 0 5px var(--off-accent-soft);
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .headline-line {
      display: block;
    }

    .status-on-text,
    .status-off-text {
      font-weight: 700;
    }

    body.status-on .status-on-text {
      display: inline;
      color: var(--on-accent);
    }

    body.status-on .status-off-text {
      display: none;
    }

    body.status-off .status-on-text {
      display: none;
    }

    body.status-off .status-off-text {
      display: inline;
      color: var(--off-accent);
    }

    .date {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    body.status-off .subtitle {
      opacity: 0.7;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
    }

    .footer {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }

    .footer strong {
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 18px 16px;
        border-radius: 20px;
      }

      h1 {
        font-size: 1.4rem;
      }

      .date {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

  <div class="wrapper">
    <div class="card">
